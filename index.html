<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splat Earth Theory</title>
  <meta name="description" content="Mapping the real world in Gaussian splats.">
  <meta property="og:title" content="Splat Earth Theory">
  <meta property="og:description" content="Mapping the real world in Gaussian splats.">
  <meta property="og:url" content="https://splatearththeory.com/">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%2389f0d0'/%3E%3Cstop offset='1' stop-color='%2389f0d0' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --ink: #eef2f0;
      --muted: #9aa5a0;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .field { position: fixed; inset: 0; pointer-events: none; }
    .splat {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.55;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .splat:nth-child(1) { width: 38vmax; height: 26vmax; left: -8vmax; top: -6vmax; background: radial-gradient(closest-side, #2f8f7a, transparent); }
    .splat:nth-child(2) { width: 30vmax; height: 34vmax; right: -10vmax; top: 18vh; background: radial-gradient(closest-side, #3a5fa8, transparent); animation-duration: 23s; }
    .splat:nth-child(3) { width: 26vmax; height: 18vmax; left: 22vw; bottom: -8vmax; background: radial-gradient(closest-side, #a8743a, transparent); animation-duration: 27s; }
    .splat:nth-child(4) { width: 12vmax; height: 9vmax; left: 58vw; top: 12vh; background: radial-gradient(closest-side, #89f0d0, transparent); opacity: 0.35; animation-duration: 15s; }
    @keyframes drift {
      from { transform: translate(0, 0) rotate(0deg) scale(1); }
      to { transform: translate(3vmax, -2vmax) rotate(12deg) scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) { .splat { animation: none; } }
    main { position: relative; padding: 2rem; max-width: 40rem; text-align: center; }
    h1 { font-size: clamp(2.4rem, 7vw, 4.75rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    p { margin-top: 1.25rem; font-size: clamp(1.05rem, 2.2vw, 1.3rem); line-height: 1.5; color: var(--muted); }
    .soon { margin-top: 2.5rem; font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <span class="splat"></span><span class="splat"></span><span class="splat"></span><span class="splat"></span>
  </div>
  <main>
    <h1>Splat Earth Theory</h1>
    <p>Mapping the real world in Gaussian splats, one capture at a time.</p>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
